<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Product preview card component</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .attribution {
        font-size: 8px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="img-ref">
        <img src="images/image-product-desktop.jpg" alt="Product" />
      </div>

      <div class="info-btn">
        <div class="heading">
          <p>Perfume</p>
        </div>

        <div class="main-heading">
          <h1>Gabrielle Essence Eau De Parfum</h1>
        </div>

        <div class="main-subtext">
          <p>
            A floral, solar and voluptuous interpretation composed by <br> Olivier Polge, Perfumer-Creator <br> for the House of CHANEL.
          </p>
        </div>

        <div class="price">
          <div class="main-price">
            <p>$149.99</p>
          </div>
          <div class="side-price">
            <p>$169.99</p>
          </div>
        </div>

        <div class="btn">
          <button><i class="fa-solid fa-cart-shopping"></i> Add to Cart</button>
        </div>
      </div>
    </div>

    <footer>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="#">Sunag Arigala</a>.
      </div>
    </footer>
    <script
      src="https://kit.fontawesome.com/630ffb3b6c.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
